<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Page not found | Car Wash Management</title>
  <link rel="icon" href="/assets/img/2732c3225_9png.png"/>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";color:#0f172a;background:#f8fafc;display:flex;flex-direction:column;min-height:100vh}
    header{background:#fff;border-bottom:1px solid #e2e8f0}
    .wrap{max-width:80rem;margin:0 auto;padding:0 1.5rem}
    header .wrap{height:4rem;display:flex;align-items:center}
    header img{height:2.5rem;width:auto;mix-blend-mode:multiply}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 1.5rem;text-align:center}
    .code{font-size:.875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0779ef;margin:0 0 .75rem}
    h1{font-size:2.25rem;line-height:1.15;font-weight:900;margin:0 0 1rem}
    p.lead{color:#475569;font-size:1.125rem;line-height:1.6;max-width:32rem;margin:0 auto 2rem}
    .actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-width:9rem;padding:.75rem 1.5rem;border-radius:.75rem;font-weight:700;text-decoration:none;font-size:1rem}
    .btn-primary{background:#0779ef;color:#fff}
    .btn-primary:hover{background:#0668d6}
    .btn-secondary{background:#fff;color:#0779ef;border:1px solid #0779ef}
    .btn-secondary:hover{background:#eff6ff}
    footer{background:#161617;color:#94a3b8;font-size:.875rem}
    footer .wrap{padding:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    footer img{height:2.5rem;width:auto}
    @media (min-width:768px){h1{font-size:3rem}}
  </style>
</head>
<body>
  <header><div class="wrap"><a href="/"><img src="/assets/img/b6e90d7ce_image.png" alt="Car Wash Management"/></a></div></header>
  <main>
    <div>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p class="lead">Sorry, we couldn't find the page you were looking for. It may have moved or no longer exists.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Home</a>
        <a class="btn btn-secondary" href="/contact">Contact</a>
      </div>
    </div>
  </main>
  <footer><div class="wrap"><img src="/assets/img/876882d67_8png-8.png" alt="Car Wash Management"/><span>Car Wash Management</span></div></footer>
</body>
</html>
